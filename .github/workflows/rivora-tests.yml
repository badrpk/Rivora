name: Rivora tests

on:
  push:
    branches: [main]
    paths:
      - 'rivora.py'
      - 'test_rivora.py'
      - '.github/workflows/rivora-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rivora.py'
      - 'test_rivora.py'
      - '.github/workflows/rivora-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-stream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run event stream tests
        run: python -m unittest test_rivora -v
